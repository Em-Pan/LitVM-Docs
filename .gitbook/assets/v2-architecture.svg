<svg xmlns="http://www.w3.org/2000/svg" width="560" height="833" viewBox="0 0 560 833" role="img" aria-labelledby="title desc">
<title id="title">LitVM V2 architecture</title><desc id="desc">Distinct roles of execution, Ethereum settlement, Litecoin interoperability, proving, sequencing and infrastructure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#278494"/></marker></defs>
<rect width="560" height="833" rx="20" fill="#f5fafb"/>
<g font-family="Arial, sans-serif"><text x="280" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#173b48">LitVM V2 architecture</text><rect x="30" y="78" width="500" height="124" rx="13" fill="#e0edf0" stroke="#c6dce1"/><text x="280" y="112" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Execution</text><text x="280" y="143" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Arbitrum Orbit and Nitro</text><text x="280" y="170" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">EVM-compatible smart contracts</text><rect x="30" y="220" width="500" height="124" rx="13" fill="#e0edf0" stroke="#c6dce1"/><text x="280" y="254" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Settlement</text><text x="280" y="285" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Ethereum</text><text x="280" y="312" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Litecoin secures native LTC ownership</text><rect x="30" y="362" width="500" height="124" rx="13" fill="#e0edf0" stroke="#c6dce1"/><text x="280" y="396" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Interoperability</text><text x="280" y="427" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Litecoin → Charms / zkLTC → Ethereum</text><text x="280" y="454" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Arbitrum connects Ethereum ↔ LitVM</text><rect x="30" y="504" width="500" height="124" rx="13" fill="#e0edf0" stroke="#c6dce1"/><text x="280" y="538" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Proving and sequencing</text><text x="280" y="569" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Succinct: proving technology</text><text x="280" y="596" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Espresso: sequencing</text><rect x="30" y="646" width="500" height="124" rx="13" fill="#e0edf0" stroke="#c6dce1"/><text x="280" y="680" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Infrastructure</text><text x="280" y="711" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Zeeve: RaaS migration target</text><text x="280" y="738" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Published endpoints remain unchanged</text><text x="280" y="802" text-anchor="middle" font-size="18" font-weight="400" fill="#173b48">V2 design; see Network Status for availability.</text></g></svg>