<g font-family="Arial, sans-serif"><text x="280" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#173b48">zkLTC in the V2 architecture</text><rect x="30" y="76" width="500" height="97" rx="13" fill="#e4ebf2" stroke="#c6dce1"/><text x="280" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Native asset</text><text x="280" y="141" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">LTC on Litecoin</text><path d="M280 180V207" fill="none" stroke="#278494" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="221" width="500" height="97" rx="13" fill="#dceff0" stroke="#c6dce1"/><text x="280" y="255" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Interoperability</text><text x="280" y="286" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Charms integration</text><path d="M280 325V352" fill="none" stroke="#278494" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="366" width="500" height="97" rx="13" fill="#e4ebf2" stroke="#c6dce1"/><text x="280" y="400" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Ethereum representation</text><text x="280" y="431" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">zkLTC: ERC-20-compatible asset</text><path d="M280 470V497" fill="none" stroke="#278494" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="511" width="500" height="97" rx="13" fill="#dceff0" stroke="#c6dce1"/><text x="280" y="545" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">Ethereum ↔ LitVM</text><text x="280" y="576" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Arbitrum infrastructure</text><path d="M280 615V642" fill="none" stroke="#278494" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="656" width="500" height="124" rx="13" fill="#e4ebf2" stroke="#c6dce1"/><text x="280" y="690" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">LitVM role</text><text x="280" y="721" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">Intended native gas asset</text><text x="280" y="748" text-anchor="middle" font-size="20" font-weight="400" fill="#173b48">and an asset for applications</text><text x="280" y="818" text-anchor="middle" font-size="18" font-weight="400" fill="#173b48">Testnet tokens are separate from native LTC.</text></g></svg>